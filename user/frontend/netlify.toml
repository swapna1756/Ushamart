[build]
  base    = "user/frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://ushamart.onrender.com"

[[redirects]]
  from  = "/*"
  to    = "/index.html"
  status = 200

# ── Cache headers ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
